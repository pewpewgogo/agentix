name: Release Agentix packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No registry-url here: setup-node would write an _authToken line into
      # .npmrc, which breaks npm's OIDC trusted-publishing detection. Publishing
      # authenticates via the id-token permission alone (npm >= 11.5.1).
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm release
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Build packages and binaries
        run: npm run build

      - name: Verify npm package contents
        run: npm run release:check

      - name: Typecheck and test
        run: npm run verify

      - name: Verify the frozen benchmark corpus
        run: npm run benchmark:corpus:check

      - name: Create release pull request or publish packages
        uses: changesets/action@v1
        with:
          version: npm run release:version
          publish: npm run release:publish
          title: Release Agentix packages
          commit: Release Agentix packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
