name: Verify Agentix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Build packages and binaries
        run: npm run build

      - name: Typecheck and test
        run: npm run verify

      - name: Verify the frozen benchmark corpus
        run: npm run benchmark:corpus:check

      - name: Check introduced patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          zero_sha=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
            head_sha=$PR_HEAD_SHA
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_AFTER_SHA" == "$zero_sha" ]]; then
              echo "Deleted ref has no introduced patch to check."
              exit 0
            fi

            head_sha=$PUSH_AFTER_SHA
            if [[ "$PUSH_BEFORE_SHA" == "$zero_sha" ]]; then
              base_sha=$(git hash-object -w -t tree /dev/null)
            else
              base_sha=$(git merge-base "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          git diff --check "$base_sha" "$head_sha" --
