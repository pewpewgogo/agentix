name: Deploy Agentix documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "scripts/prepare-pages.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare documentation source
        run: node scripts/prepare-pages.mjs

      - name: Build documentation with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.agentix-tmp/pages-source
          destination: ./.agentix-tmp/pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.agentix-tmp/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
